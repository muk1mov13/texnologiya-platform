# Cloudflare Tunnel: HTTPS'ni Cloudflare beradi, cloudflared so'rovni shu yerga oddiy HTTP bilan
# olib keladi (Public hostname: HTTP 127.0.0.1:80). Ochiq IP, port yo'naltirish va certbot kerak emas.
# Faqat 127.0.0.1 da tinglaydi — tashqaridan to'g'ridan-to'g'ri ochilmaydi.
# edubuxdpi.conf bilan bir xil, faqat ssl'siz va haqiqiy IP CF-Connecting-IP sarlavhasidan.
# ip-http.conf yoki edubuxdpi*.conf bilan bir vaqtda yoqilmaydi (upstream nomi bir xil).
# .env: COOKIE_SECURE=true, CORS_ORIGINS/PUBLIC_BASE_URL = https://edubuxdpi.uz (deploy/README.md).

upstream texnologiya_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Foydalanuvchining haqiqiy IP'si. Busiz hamma 127.0.0.1 bo'lib ko'rinadi va login, kontakt
# hamda AI yordamchi limitlari barcha foydalanuvchilarni birga bloklaydi.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header CF-Connecting-IP;

# www -> asosiy domen.
server {
    listen 127.0.0.1:80;
    server_name www.edubuxdpi.uz;
    return 301 https://edubuxdpi.uz$request_uri;
}

server {
    listen 127.0.0.1:80 default_server;
    server_name edubuxdpi.uz;

    # Material 50 MB, kutubxona 50 MB (MAX_*_MB) + multipart zaxirasi (Cloudflare Free: 100 MB).
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml text/plain;

    # Xavfsizlik sarlavhalari ("always" — xato javoblarida ham).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Hamma resurs o'zimizdan; inline style — motion animatsiyalari, blob: — himoyalangan
    # fayllar va muqovalar, wasm — pdf.js dekoderlari.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    root /srv/texnologiya/app/frontend/dist;
    index index.html;

    # Vite fayl nomlarida hash bor — uzoq kesh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;

        # pdf.js worker (.mjs) modul skript sifatida yuklanadi va JS MIME talab qiladi;
        # nginx 1.18 mime.types da .mjs yo'q (application/octet-stream qaytaradi).
        location ~* \.mjs$ {
            types { }
            default_type text/javascript;
        }
    }

    # SPA: mavjud bo'lmagan yo'llar index.html ga (React Router), index.html keshlanmaydi.
    location / {
        try_files $uri /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Foydalanuvchi Cloudflare'gacha HTTPS'da keladi, shuning uchun proto doim https.
    location = /sitemap.xml {
        proxy_pass http://texnologiya_api/api/seo/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /robots.txt {
        proxy_pass http://texnologiya_api/api/seo/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://texnologiya_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Tutor javobi SSE oqimi: buferlash o'chiq, uzoq javob uchun kutish oshirilgan.
        proxy_buffering off;
        proxy_read_timeout 300s;
        # Katta fayl yuklashda diskka vaqtincha yozmasdan to'g'ridan-to'g'ri uzatish.
        proxy_request_buffering off;
    }

    # Himoyalangan fayllar: ruxsatni API tekshiradi va X-Accel-Redirect qaytaradi
    # (core/files.py, learning/progress_router.py), faylni nginx shu yerdan beradi.
    location /protected-media/ {
        internal;
        alias /srv/texnologiya/media/;
    }
}
