# 443-port: frontend (SPA), /api proksi va himoyalangan fayllar.
# Sertifikat: certbot certonly --webroot -w /var/www/certbot -d edubuxdpi.uz -d www.edubuxdpi.uz

upstream texnologiya_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# www -> asosiy domen.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.edubuxdpi.uz;

    ssl_certificate     /etc/letsencrypt/live/edubuxdpi.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edubuxdpi.uz/privkey.pem;

    return 301 https://edubuxdpi.uz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name edubuxdpi.uz;

    ssl_certificate     /etc/letsencrypt/live/edubuxdpi.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edubuxdpi.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Material 50 MB, kutubxona 50 MB (MAX_*_MB) + multipart zaxirasi.
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml text/plain;

    # Xavfsizlik sarlavhalari ("always" — xato javoblarida ham).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Hamma resurs o'zimizdan; inline style — motion animatsiyalari, blob: — himoyalangan
    # fayllar va muqovalar, wasm — pdf.js dekoderlari.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    root /srv/texnologiya/app/frontend/dist;
    index index.html;

    # Vite fayl nomlarida hash bor — uzoq kesh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;

        # pdf.js worker (.mjs) modul skript sifatida yuklanadi va JS MIME talab qiladi;
        # nginx 1.18 mime.types da .mjs yo'q (application/octet-stream qaytaradi).
        location ~* \.mjs$ {
            types { }
            default_type text/javascript;
        }
    }

    # SPA: mavjud bo'lmagan yo'llar index.html ga (React Router), index.html keshlanmaydi.
    location / {
        try_files $uri /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location = /sitemap.xml {
        proxy_pass http://texnologiya_api/api/seo/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /robots.txt {
        proxy_pass http://texnologiya_api/api/seo/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://texnologiya_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Tutor javobi SSE oqimi: buferlash o'chiq, uzoq javob uchun kutish oshirilgan.
        proxy_buffering off;
        proxy_read_timeout 300s;
        # Katta fayl yuklashda diskka vaqtincha yozmasdan to'g'ridan-to'g'ri uzatish.
        proxy_request_buffering off;
    }

    # Himoyalangan fayllar: ruxsatni API tekshiradi va X-Accel-Redirect qaytaradi
    # (core/files.py, learning/progress_router.py), faylni nginx shu yerdan beradi.
    location /protected-media/ {
        internal;
        alias /srv/texnologiya/media/;
    }
}
