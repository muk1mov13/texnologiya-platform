# 80-port: Let's Encrypt tekshiruvi (webroot) va qolgan hamma narsa HTTPS'ga.
# Birinchi bo'lib shu fayl yoqiladi, sertifikat olingach edu-metod.conf (443) qo'shiladi.
# default_server: ochiq IP (87.192.233.178) orqali kelgan so'rov ham domenga yo'naltiriladi.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name edu-metod.uz _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://edu-metod.uz$request_uri;
    }
}
