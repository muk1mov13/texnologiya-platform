# 80-port: Let's Encrypt tekshiruvi (webroot) va qolgan hamma narsa HTTPS'ga.
# Birinchi bo'lib shu fayl yoqiladi, sertifikat olingach edubuxdpi.conf (443) qo'shiladi.

server {
    listen 80;
    listen [::]:80;
    server_name edubuxdpi.uz www.edubuxdpi.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://edubuxdpi.uz$request_uri;
    }
}
