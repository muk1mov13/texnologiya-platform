# edu-metod.uz Proxmox'dagi tashqi nginx proksisi (172.20.172.5) orqasida: HTTPS va sertifikat
# o'sha yerda, so'rov bu VM'ning 80-portiga oddiy HTTP bo'lib keladi. edu-metod.conf bilan bir xil,
# faqat ssl'siz; haqiqiy IP proksining X-Forwarded-For sarlavhasidan.
# ip-http.conf yoki edu-metod*.conf bilan bir vaqtda yoqilmaydi (default_server, upstream nomi bir xil).
# .env: COOKIE_SECURE=true, CORS_ORIGINS/PUBLIC_BASE_URL = https://edu-metod.uz (deploy/README.md).

upstream texnologiya_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name edu-metod.uz _;

    # Haqiqiy IP: busiz login/kontakt/AI limitlari hamma foydalanuvchini birga bloklaydi.
    set_real_ip_from 172.20.172.5;
    real_ip_header X-Forwarded-For;
    # API'ga faqat shu manzil (mijoz soxtalashtira olmaydi) va doim https sxemasi uzatiladi.

    # Material 50 MB, kutubxona 50 MB (MAX_*_MB) + multipart zaxirasi.
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml text/plain;

    # Xavfsizlik sarlavhalari ("always" — xato javoblarida ham).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Hamma resurs o'zimizdan; inline style — motion animatsiyalari, blob: — himoyalangan
    # fayllar va muqovalar, wasm — pdf.js dekoderlari.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    root /srv/texnologiya/app/frontend/dist;
    index index.html;

    # Vite fayl nomlarida hash bor — uzoq kesh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;

        # pdf.js worker (.mjs) modul skript sifatida yuklanadi va JS MIME talab qiladi;
        # nginx 1.18 mime.types da .mjs yo'q (application/octet-stream qaytaradi).
        location ~* \.mjs$ {
            types { }
            default_type text/javascript;
        }
    }

    # SPA: mavjud bo'lmagan yo'llar index.html ga (React Router), index.html keshlanmaydi.
    location / {
        try_files $uri /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location = /sitemap.xml {
        proxy_pass http://texnologiya_api/api/seo/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /robots.txt {
        proxy_pass http://texnologiya_api/api/seo/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://texnologiya_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Tutor javobi SSE oqimi: buferlash o'chiq, uzoq javob uchun kutish oshirilgan.
        proxy_buffering off;
        proxy_read_timeout 300s;
        # Katta fayl yuklashda diskka vaqtincha yozmasdan to'g'ridan-to'g'ri uzatish.
        proxy_request_buffering off;
    }

    # Himoyalangan fayllar: ruxsatni API tekshiradi va X-Accel-Redirect qaytaradi
    # (core/files.py, learning/progress_router.py), faylni nginx shu yerdan beradi.
    location /protected-media/ {
        internal;
        alias /srv/texnologiya/media/;
    }
}
